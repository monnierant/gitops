apiVersion: apps/v1
kind: Deployment
metadata:
  name: apikey-auth
  namespace: security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apikey-auth
  template:
    metadata:
      labels:
        app: apikey-auth
    spec:
      containers:
        - name: app
          image: tiangolo/uvicorn-gunicorn-fastapi:python3.11
          env:
            - name: APP_MODULE
              value: "main:app" # <-- tell Gunicorn to import /app/main.py -> app
            - name: KEYSETS_JSON
              valueFrom:
                secretKeyRef:
                  name: api-gw-keysets
                  key: KEYSETS_JSON
          ports:
            - containerPort: 80
          # Profil "web/standard" : request = p95, limite memoire =
          # max(1,5 x request, 1,2 x max), pas de limite CPU.
          # Base : p95 27m / 501Mi, max 503Mi sur 51h, 2026-10-14.
          resources:
            requests:
              cpu: 30m
              memory: 512Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: appcode
              mountPath: /app
      volumes:
        - name: appcode
          configMap:
            name: apikey-auth-app
