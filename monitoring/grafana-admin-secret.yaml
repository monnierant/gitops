apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: external-secrets
  target:
    name: grafana-admin
    creationPolicy: Owner
  # ATTENTION : "extract" deserialise la valeur GCPSM comme un objet JSON pour en
  # tirer les paires cle/valeur. La valeur de k8s1-grafana DOIT donc etre un JSON :
  #   {"admin-user": "admin", "admin-password": "..."}
  # Un mot de passe stocke en chaine brute echoue avec :
  #   "unable to unmarshal secret: invalid character 'X' looking for beginning of value"
  # Pour une chaine brute, il faudrait le pattern data + remoteRef + template
  # (cf. argo-secrets/private-gitops-deploy-secrets.yaml).
  dataFrom:
    - extract:
        key: k8s1-grafana
