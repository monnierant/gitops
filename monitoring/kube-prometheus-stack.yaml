apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Les CRD du prometheus-operator depassent la limite d'annotation de
      # kubectl apply : sans ServerSideApply, le sync echoue sur "metadata.annotations
      # too long".
      - ServerSideApply=true
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 88.2.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # --- Composants du control-plane Talos ---
        # controller-manager, scheduler et etcd n'ecoutent que sur 127.0.0.1 sur
        # Talos : les scraper donnerait 3 cibles DOWN en permanence et les alertes
        # associees hurleraient sans arret. Alternative ecartee : binder sur
        # 0.0.0.0 dans la machineconfig des 3 noeuds (hors repo).
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false

        prometheus:
          prometheusSpec:
            # Budget disque < 10 Gi partage avec n8n / obsidian / authentik.
            scrapeInterval: 60s
            evaluationInterval: 60s
            retention: 7d
            # Garde-fou reel : borne la TSDB meme en cas de pic de cardinalite.
            # La retention en temps seule ne protege de rien.
            retentionSize: 2GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      # ~1.5x le retentionSize : le cap ne couvre ni le WAL ni les
                      # blocs en cours de compaction.
                      storage: 3Gi
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
            # Metriques a forte cardinalite, sans valeur sur un homelab.
            metricRelabelings:
              - sourceLabels: [__name__]
                regex: "apiserver_request_duration_seconds_bucket|apiserver_response_sizes_bucket|container_network_tcp_usage_total|container_network_udp_usage_total|etcd_request_duration_seconds_bucket"
                action: drop

        alertmanager:
          alertmanagerSpec:
            # Pas de PVC : l'etat d'Alertmanager (silences, notifications envoyees)
            # est reconstruit au demarrage. Ne vaut pas un volume sur ce cluster.
            storage: {}
            # Profil "a etat" : request = limit memoire (max x 1,2), pas de
            # limite CPU. Base : p95 1m / 39Mi, max 47Mi sur 51h, 2026-10-14.
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 64Mi

        grafana:
          # Mot de passe admin issu de GCP Secret Manager via ESO
          # (cf. grafana-admin-secret.yaml). Meme pattern que authentik-creds :
          # pas besoin d'AVP, le chart accepte un Secret existant.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # Dashboards livres par le chart via ConfigMap : rien a persister.
          # Un dashboard cree a la main dans l'UI serait perdu au redemarrage.
          persistence:
            enabled: false
          # Sans root_url explicite, le chart derive le domaine de ingress.hosts
          # mais construit une URL avec le port interne (3000) : les liens
          # absolus et les redirections d'auth partent alors sur un port injoignable
          # depuis l'exterieur.
          grafana.ini:
            server:
              domain: grafana.amonnier.fr
              root_url: https://grafana.amonnier.fr
          # Convention du repo : classe via annotation (cf. apps/obsidian,
          # apps/n8n, apps/mcp), entrypoint websecure et certresolver
          # letsencrypt-prod declares dans infra-with-secrets/traefik.yaml.
          ingress:
            enabled: true
            annotations:
              kubernetes.io/ingress.class: traefik
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
              traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-prod
            hosts:
              - grafana.amonnier.fr
            path: /
            pathType: Prefix
            tls:
              - hosts:
                  - grafana.amonnier.fr
                secretName: grafana-tls
          # Profil "web/standard" : request = p95, limite memoire =
          # max(1,5 x request, 1,2 x max), pas de limite CPU.
          # Base : p95 14m / 317Mi, pic 976Mi sur 51h, 2026-10-14.
          resources:
            requests:
              cpu: 15m
              memory: 320Mi
            limits:
              memory: 1184Mi
          # Sidecars sc-dashboard / sc-datasources (meme cle pour les deux).
          # Meme profil. Base : p95 2m / 87Mi, max 88Mi.
          sidecar:
            resources:
              requests:
                cpu: 5m
                memory: 96Mi
              limits:
                memory: 144Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi

        # Profil "web/standard". Base : p95 3m / 60Mi, max 63Mi sur 51h,
        # 2026-10-14.
        kube-state-metrics:
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
            limits:
              memory: 96Mi

        prometheusOperator:
          # Profil "web/standard". Base : p95 4m / 64Mi, max 70Mi sur 51h,
          # 2026-10-14.
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
            limits:
              memory: 96Mi
          # config-reloader des pods Prometheus ET Alertmanager (une seule
          # cle). Meme profil. Base : p95 0m / 26Mi, max 28Mi.
          prometheusConfigReloader:
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 48Mi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
