# Alias de service : le dashboard TUI cherche "alertmanager-main:9093", nom issu
# de la convention kube-prometheus (jsonnet). Le chart Helm, lui, nomme son
# service "kube-prometheus-stack-alertmanager". Ce Service supplementaire pointe
# sur les memes pods, sans toucher au chart ni gener ses upgrades.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-main
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: kube-prometheus-stack-alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
      protocol: TCP
