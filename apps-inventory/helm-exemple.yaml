apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-exemple
  namespace: argocd
spec:
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # Pod Security Admission : restricted applique (lot 6b), warn/audit
        # restent poses pour garder la trace des violations.
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
  source:
    chart: echo-server
    repoURL: https://ealenn.github.io/charts
    targetRevision: 0.5.0
    helm:
      releaseName: echo-server
      values: |
        replicaCount: 3
        # Profil "web/standard" : request = p95, limite memoire =
        # max(1,5 x request, 1,2 x max), pas de limite CPU.
        # Base : p95 0,4m / 44Mi, max 2,6m / 45Mi sur 52h, 2026-10-14.
        resources:
          requests:
            cpu: 5m
            memory: 48Mi
          limits:
            cpu: null
            memory: 80Mi
        # Pod Security "restricted" (lot 6b). L'image (node:lts-alpine,
        # ENTRYPOINT node webserver) ne declare pas de USER : on fixe l'uid
        # de l'utilisateur "node" (1000). Le serveur ne fait que lire, rien
        # n'est ecrit sur disque. Le port 80 reste ouvert a un uid non root :
        # containerd 2 pose net.ipv4.ip_unprivileged_port_start=0 dans le pod.
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ingress:
          enabled: true
          hosts:
            - host: echo.amonnier.fr
              paths:
                - / 
          annotations:
            kubernetes.io/ingress.class: traefik
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-prod

  destination:
    server: "https://kubernetes.default.svc"
    namespace: helm-exemple-external
