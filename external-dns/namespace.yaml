# Ce manifeste est necessaire meme si l'Application parente a CreateNamespace=true :
# celle-ci cree le namespace sans aucun label.
# Les valeurs par defaut du chart external-dns (non-root, readOnlyRootFilesystem,
# drop ALL, seccomp RuntimeDefault) passent le profil restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
