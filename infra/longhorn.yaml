apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      # Longhorn n'autorise qu'un saut de minor a la fois : 1.9 -> 1.10 -> 1.11 -> 1.12.
      # Ne pas laisser Renovate bumper plusieurs minors d'un coup, le manager refuse de demarrer.
      targetRevision: 1.9.1 # Replace with the Longhorn version you'd like to install or upgrade to
      helm:
        values: |
          preUpgradeChecker:
            jobEnabled: false
          defaultSettings:
            defaultReplicaCount: 1
            nodeDownPodDeletionPolicy: "delete-both-statefulset-and-deployment-pod"
            defaultDataPath: "/var/lib/longhorn"
            storageReservedPercentageForDefaultDisk: 10
          persistence:
            defaultClass: true
            # Retain : une PVC supprimee par erreur (prune Argo, manip) laisse
            # le volume Longhorn intact et recuperable. Contrepartie : les
            # volumes des apps reellement supprimees doivent etre nettoyes a la
            # main dans l'UI Longhorn.
            reclaimPolicy: Retain
          longhornManager:
            tolerations:
              - key: "node-role.kubernetes.io/control-plane"
                operator: "Exists"
                effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
