apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      # Longhorn n'autorise qu'un saut de minor a la fois : 1.9 -> 1.10 -> 1.11 -> 1.12.
      # Ne pas laisser Renovate bumper plusieurs minors d'un coup, le manager refuse de demarrer.
      targetRevision: 1.12.1 # Replace with the Longhorn version you'd like to install or upgrade to
      helm:
        values: |
          # Garde-fou natif de Longhorn : valide le chemin d'upgrade AVANT de
          # toucher au DaemonSet. Desactive, le saut 1.9.1 -> 1.12.0 est parti
          # quand meme et a bricke les 3 longhorn-manager (le CSI tombe, tous
          # les pods a PVC restent en ContainerCreating). Active, la sync Argo
          # echoue proprement et le stockage reste intact.
          preUpgradeChecker:
            jobEnabled: true
          defaultSettings:
            defaultReplicaCount: 1
            # A 0 (defaut), les engines des volumes restent sur l'ancienne
            # version apres un upgrade du control plane : on s'est retrouve
            # avec longhorn-manager en 1.10.2 et les 20 volumes encore en
            # engine v1.9.1. A 1, Longhorn live-upgrade les engines un volume
            # a la fois par node, ce qui solde chaque palier avant le suivant.
            # Ne concerne que les volumes healthy ou detached : un volume
            # degraded reste sur son ancien engine.
            concurrentAutomaticEngineUpgradePerNodeLimit: 1
            nodeDownPodDeletionPolicy: "delete-both-statefulset-and-deployment-pod"
            defaultDataPath: "/var/lib/longhorn"
            storageReservedPercentageForDefaultDisk: 10
          persistence:
            defaultClass: true
            # Retain : une PVC supprimee par erreur (prune Argo, manip) laisse
            # le volume Longhorn intact et recuperable. Contrepartie : les
            # volumes des apps reellement supprimees doivent etre nettoyes a la
            # main dans l'UI Longhorn.
            reclaimPolicy: Retain
          longhornManager:
            tolerations:
              - key: "node-role.kubernetes.io/control-plane"
                operator: "Exists"
                effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
