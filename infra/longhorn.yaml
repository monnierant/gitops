apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      # Longhorn n'autorise qu'un saut de minor a la fois : 1.9 -> 1.10 -> 1.11 -> 1.12.
      # Ne pas laisser Renovate bumper plusieurs minors d'un coup, le manager refuse de demarrer.
      targetRevision: 1.12.0 # Replace with the Longhorn version you'd like to install or upgrade to
      helm:
        values: |
          # Garde-fou natif de Longhorn : valide le chemin d'upgrade AVANT de
          # toucher au DaemonSet. Desactive, le saut 1.9.1 -> 1.12.0 est parti
          # quand meme et a bricke les 3 longhorn-manager (le CSI tombe, tous
          # les pods a PVC restent en ContainerCreating). Active, la sync Argo
          # echoue proprement et le stockage reste intact.
          preUpgradeChecker:
            jobEnabled: true
          defaultSettings:
            defaultReplicaCount: 1
            # A 0 (defaut), les engines des volumes restent sur l'ancienne
            # version apres un upgrade du control plane : on s'est retrouve
            # avec longhorn-manager en 1.10.2 et les 20 volumes encore en
            # engine v1.9.1. A 1, Longhorn live-upgrade les engines un volume
            # a la fois par node, ce qui solde chaque palier avant le suivant.
            # Ne concerne que les volumes healthy ou detached : un volume
            # degraded reste sur son ancien engine.
            concurrentAutomaticEngineUpgradePerNodeLimit: 1
            nodeDownPodDeletionPolicy: "delete-both-statefulset-and-deployment-pod"
            defaultDataPath: "/var/lib/longhorn"
            storageReservedPercentageForDefaultDisk: 10
            # CPU reserve par instance-manager, en % de l'allocatable du noeud.
            # A 12 (defaut), on reservait 474m sur les CP et 234m sur tal04/05
            # pour une p95 mesuree de 8 a 20m (max 24m) : 23 a 53x trop.
            # A 1 : 39m sur les CP, 19m sur les workers, 159m sur tal06 (p95
            # 1,9 coeur, sans limite : il garde l'acces au CPU libre).
            # v2 : valeur actuelle conservee, le moteur v2 est desactive.
            # Mesure : p95/max sur 51h, 2026-10-14.
            # ATTENTION : changer ce setting redemarre les instance-managers
            # (et donc les engines) : a merger volumes detaches, en fenetre de
            # maintenance (volumes a une seule replique).
            guaranteedInstanceManagerCPU:
              v1: "1"
              v2: "31"
          # Cible des backups (ADR 0002) : partage NFS dedie du NAS, export
          # restreint a 192.168.1.17 (connecteur Twingate, seule IP vue par le
          # NAS) avec "insecure" (Twingate NAT le port source -> EPERM sinon)
          # et en sync (un backup ne doit pas etre ack avant d'etre sur disque).
          # Les volumes n'y entrent que par opt-in : cf. RecurringJobs du
          # groupe "critique" dans post-install-cr/.
          defaultBackupStore:
            backupTarget: nfs://192.168.1.19:/Volume1/Backups/Longhorn
            pollInterval: 300
          metrics:
            serviceMonitor:
              enabled: true
              # Selecteur par defaut de kube-prometheus-stack.
              additionalLabels:
                release: kube-prometheus-stack
          persistence:
            defaultClass: true
            # Retain : une PVC supprimee par erreur (prune Argo, manip) laisse
            # le volume Longhorn intact et recuperable. Contrepartie : les
            # volumes des apps reellement supprimees doivent etre nettoyes a la
            # main dans l'UI Longhorn.
            reclaimPolicy: Retain
          longhornManager:
            # Profil "systeme critique" : request = p95, aucune limite.
            # Base : p95 82m / 244Mi (tal06, max des pods du DaemonSet) sur
            # 51h, 2026-10-14. Les autres noeuds tournent a ~12m / 150Mi.
            resources:
              requests:
                cpu: 85m
                memory: 256Mi
            tolerations:
              - key: "node-role.kubernetes.io/control-plane"
                operator: "Exists"
                effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
