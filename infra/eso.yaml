apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso
  namespace: argocd
spec:
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Les CRD external-secrets v2 depassent la limite de 262144 octets de
      # l'annotation last-applied-configuration posee par l'apply client-side.
      # Le server-side apply ne l'utilise pas.
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        # Pod Security Admission : restricted applique (lot 6b), warn/audit
        # restent poses pour garder la trace des violations.
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: 2.13.0
    helm:
      releaseName: eso
      values: |
        # Profil "web/standard" : request = p95, limite memoire =
        # max(1,5 x request, 1,2 x max), pas de limite CPU.
        # Base : p95/max sur 51h, 2026-10-14.
        resources:
          requests:
            cpu: 5m
            memory: 80Mi
          limits:
            memory: 160Mi
        certController:
          resources:
            requests:
              cpu: 5m
              memory: 80Mi
            limits:
              memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 5m
              memory: 48Mi
            limits:
              memory: 80Mi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-secrets
