apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso
  namespace: argocd
spec:
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Les CRD external-secrets v2 depassent la limite de 262144 octets de
      # l'annotation last-applied-configuration posee par l'apply client-side.
      # Le server-side apply ne l'utilise pas.
      - ServerSideApply=true
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: 2.10.0
    helm:
      releaseName: eso
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-secrets
