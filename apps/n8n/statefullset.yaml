apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: n8n
  namespace: n8n
spec:
  serviceName: n8n
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      # Pod Security "restricted". OnRootMismatch : la racine du volume est
      # deja en groupe 1000 (2775), le chown recursif a chaque demarrage est inutile.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:2.44.3@sha256:5032941f437e1daa421cad0cc3ea57cd054f0d44a7256b38a0a3fca1b460834a
          securityContext:
            runAsUser: 1000
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "0"
            - name: UMASK
              value: "002"
            - name: TZ
              value: "Europe/Paris"
            - name: N8N_SECURE_COOKIE
              value: "true"
            - name: N8N_EDITOR_BASE_URL
              value: "https://n8n.promonni.com/"
            - name: WEBHOOK_URL
              value: "https://n8n.promonni.com/"
            - name: N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE
              value: "true"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-encryption
                  key: encryption-key
          # Profil "web/standard" : request = p95, limite memoire =
          # max(1,5 x request, 1,2 x max), pas de limite CPU.
          # Base : p95 2,4m / 447Mi, max 22m / 459Mi sur 52h, 2026-10-14.
          resources:
            requests:
              cpu: 5m
              memory: 448Mi
            limits:
              memory: 672Mi
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
