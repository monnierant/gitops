apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
  labels:
    # Sauvegarde Longhorn, groupe critique (ADR 0002)
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/critique: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi # adapte la taille selon tes besoins
  storageClassName: longhorn
  # Lie explicitement au PV statique de pv.yaml, qui pointe sur le volume
  # Longhorn existant. Sans ca, une PVC recreee provisionnerait un volume
  # neuf et vide.
  volumeName: n8n-data-pv
