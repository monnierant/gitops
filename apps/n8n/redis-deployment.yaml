apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # Pod Security "restricted" : uid/gid redis de l'image (999), proprietaire
      # de /data. Lance directement en 999, l'entrypoint saute le chown/gosu.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--save"
            - "60"
            - "1000"
          ports:
            - containerPort: 6379
          # Profil "a etat" : request CPU = p95, request = limite memoire =
          # 1,2 x max, pas de limite CPU.
          # Base : p95 2,4m / 11Mi, max 3,5m / 12Mi sur 52h, 2026-10-14.
          # Plancher 64Mi : 52h d'historique trop court pour une base (fork AOF).
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
            limits:
              memory: 64Mi
