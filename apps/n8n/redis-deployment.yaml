apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10.0
          args:
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--save"
            - "60"
            - "1000"
          ports:
            - containerPort: 6379
          # Profil "a etat" : request CPU = p95, request = limite memoire =
          # 1,2 x max, pas de limite CPU.
          # Base : p95 2,4m / 11Mi, max 3,5m / 12Mi sur 52h, 2026-10-14.
          # Plancher 64Mi : 52h d'historique trop court pour une base (fork AOF).
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
            limits:
              memory: 64Mi
