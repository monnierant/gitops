# Proprietes attendues dans le secret externe k8s1-keycloak-config-cli (JSON) :
#   client-id     : "keycloak-config-cli"
#   client-secret : onglet Credentials du client de bootstrap
#                   "keycloak-config-cli" (realm amonnier.fr, service account
#                   avec le role realm-management/realm-admin, cree a la main)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-config-cli-auth
  namespace: keycloak
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: external-secrets
  target:
    name: keycloak-config-cli-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s1-keycloak-config-cli
---
# Secret du client "oauth2-proxy", pose sur le client par keycloak-config-cli.
# Source unique : la propriete client-secret de k8s1-oauth2-proxy, aussi lue
# par oauth2-proxy (apps/oauth2-proxy/secret.yaml). Seule cette propriete est
# copiee dans le namespace keycloak (pas le cookie-secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-config-oauth2-proxy
  namespace: keycloak
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: external-secrets
  target:
    name: keycloak-config-oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: k8s1-oauth2-proxy
        property: client-secret
