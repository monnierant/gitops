apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-helm
  namespace: argocd
spec:
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  source:
    chart: keycloakx
    repoURL: https://codecentric.github.io/helm-charts
    targetRevision: 7.3.2
    helm:
      releaseName: keycloak
      values: |
        command:
          - /opt/keycloak/bin/kc.sh
          - start
          - --http-port=8080
        http:
          relativePath: /
        # Traefik transmet X-Forwarded-*, pas l'en-tete Forwarded (RFC 7239)
        proxy:
          enabled: true
          mode: xforwarded
        database:
          vendor: postgres
          hostname: keycloak-postgres
          port: 5432
          database: keycloak
          username: keycloak
          existingSecret: keycloak-creds
          existingSecretKey: db-password
        dbchecker:
          enabled: true
          # Pas de limite CPU : le defaut du chart (20m) est retire, le reste
          # du defaut (20m / 32Mi) est conserve, faute de mesure (init container).
          resources:
            limits:
              cpu: null
        extraEnv: |
          - name: KC_HOSTNAME
            value: https://keycloak.amonnier.fr
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: admin
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-creds
                key: admin-password
          - name: JAVA_OPTS_APPEND
            value: -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless
        # Profil "web/standard" : request = p95, limite memoire =
        # max(1,5 x request, 1,2 x max), pas de limite CPU.
        # Base : p95 12m / 731Mi, max 414m / 767Mi sur 52h, 2026-10-14.
        # Limite conservee a 1536Mi : le tas JVM est calcule en % de la limite.
        resources:
          requests:
            cpu: 15m
            memory: 736Mi
          limits:
            memory: 1536Mi
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-prod
          rules:
            - host: keycloak.amonnier.fr
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - keycloak.amonnier.fr
              secretName: keycloak-tls
  destination:
    server: "https://kubernetes.default.svc"
    namespace: keycloak
