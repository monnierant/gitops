apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-helm
  namespace: argocd
spec:
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  source:
    chart: keycloakx
    repoURL: https://codecentric.github.io/helm-charts
    targetRevision: 7.3.2
    helm:
      releaseName: keycloak
      values: |
        command:
          - /opt/keycloak/bin/kc.sh
          - start
          - --http-port=8080
          # Import de bootstrap uniquement : sans effet si le realm existe.
          - --import-realm
        # Monte en subPath : Keycloak ignore les liens symboliques ..data/
        # d'une ConfigMap montee en repertoire.
        extraVolumes: |
          - name: realm
            configMap:
              name: keycloak-realm
        extraVolumeMounts: |
          - name: realm
            mountPath: /opt/keycloak/data/import/realm.json
            subPath: realm.json
            readOnly: true
        http:
          relativePath: /
        # Traefik transmet X-Forwarded-*, pas l'en-tete Forwarded (RFC 7239)
        proxy:
          enabled: true
          mode: xforwarded
        database:
          vendor: postgres
          hostname: keycloak-postgres
          port: 5432
          database: keycloak
          username: keycloak
          existingSecret: keycloak-creds
          existingSecretKey: db-password
        dbchecker:
          enabled: true
        extraEnv: |
          - name: KC_HOSTNAME
            value: https://keycloak.amonnier.fr
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: admin
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-creds
                key: admin-password
          # Resolus dans realm.json au moment de l'import.
          - name: MCP_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: keycloak-creds
                key: mcp-client-secret
          - name: MCP_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-creds
                key: mcp-user-password
          - name: JAVA_OPTS_APPEND
            value: -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless
        resources:
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            memory: 1536Mi
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-prod
          rules:
            - host: keycloak.amonnier.fr
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - keycloak.amonnier.fr
              secretName: keycloak-tls
  destination:
    server: "https://kubernetes.default.svc"
    namespace: keycloak
