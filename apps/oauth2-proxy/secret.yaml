# Proprietes attendues dans le secret externe k8s1-oauth2-proxy (JSON) :
#   client-id     : "oauth2-proxy"
#   client-secret : onglet Credentials du client "oauth2-proxy", realm
#                   amonnier.fr, Keycloak keycloak.amonnier.fr
#   cookie-secret : 32 octets, `openssl rand -base64 32 | tr -- '+/' '-_'`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-secrets
  namespace: oauth2-proxy
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: external-secrets
  target:
    name: oauth2-proxy-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s1-oauth2-proxy
