apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-base
  namespace: knowledge-base
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-base
  template:
    metadata:
      labels:
        app: knowledge-base
    spec:
      containers:
        - name: knowledge-base
          image: monnierant/knowledge-base:1.2.0@sha256:2408d7d221c2842da9aa7e560fd4c1f41d01985fff87d61420f118d40498627b
          ports:
            - containerPort: 80
          # Profil "web/standard" : request = p95, limite memoire =
          # max(1,5 x request, 1,2 x max), pas de limite CPU.
          # Base : p95 0,0m / 19Mi, max 0,1m / 19Mi sur 52h, 2026-10-14.
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 48Mi
