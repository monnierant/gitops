# Un seul secret JSON dans Google Secret Manager, `k8s1-postiz`, dont chaque
# propriete devient une cle du Secret Kubernetes `postiz` (memes noms que les
# variables d'environnement qu'elles alimentent) :
#
#   POSTGRES_PASSWORD -> role `postiz`, lu par Postgres (initdb, premier
#     demarrage seulement), Temporal et l'application. Doit rester URL-safe
#     (interpole dans DATABASE_URL). Le changer apres coup impose un ALTER ROLE.
#   JWT_SECRET -> signature des sessions ; la rotation deconnecte tout le monde.
#
# Les identifiants des providers (LinkedIn, Instagram...) vivent a part, dans
# `k8s1-postiz-providers` (ExternalSecret `postiz-providers` ci-dessous).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz
  namespace: postiz
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: external-secrets
  target:
    name: postiz
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s1-postiz
---
# Identifiants des providers, dans le JSON GCPSM `k8s1-postiz-providers` :
#   { "LINKEDIN_CLIENT_ID": "...", "LINKEDIN_CLIENT_SECRET": "...", ... }
# Chaque cle est injectee telle quelle en variable d'environnement du conteneur
# postiz (`envFrom`) : elle doit porter le nom attendu par Postiz (A-Z, 0-9, _).
# Les URLs (FRONTEND_URL...) restent en clair dans le Deployment, pas ici.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz-providers
  namespace: postiz
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: external-secrets
  target:
    name: postiz-providers
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: k8s1-postiz-providers
