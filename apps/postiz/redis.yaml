apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: postiz
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: postiz
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # Pod Security "restricted" : uid/gid redis de l'image (999), deja
      # proprietaire de /data. Pas de fsGroup : aucun chown du volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # Toute la stack postiz reste hors des control-planes (voir postiz.yaml).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: redis
          image: redis:8.10.3@sha256:298641b35ac51aa999f9bb85707d6681fe635ce59cda51886a0b6adc1da37b8e
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Redis porte les files BullMQ de Postiz (publications programmees) :
          # l'AOF evite de perdre les jobs en attente au redemarrage du pod.
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          # Profil "a etat" : request CPU = p95, request = limite memoire =
          # 1,2 x max, pas de limite CPU.
          # Base : p95 8,7m / 12Mi, max 17m / 17Mi sur 52h, 2026-10-14.
          # Plancher 64Mi : 52h d'historique trop court pour une base (fork AOF).
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
