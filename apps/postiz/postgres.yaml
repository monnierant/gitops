# Postgres unique pour Postiz et Temporal : Temporal (auto-setup) cree lui-meme
# ses bases `temporal` et `temporal_visibility` avec ce superutilisateur.
# Un seul volume plutot que deux, disque oblige.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postiz
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postiz
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Toute la stack postiz reste hors des control-planes (voir postiz.yaml).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: postiz
            - name: POSTGRES_DB
              value: postiz
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postiz
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postiz", "-d", "postiz"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              # Conso observee ~80 Mi (postiz + bases Temporal).
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
