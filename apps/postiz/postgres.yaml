# Postgres unique pour Postiz et Temporal : Temporal (auto-setup) cree lui-meme
# ses bases `temporal` et `temporal_visibility` avec ce superutilisateur.
# Un seul volume plutot que deux, disque oblige.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postiz
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postiz
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Toute la stack postiz reste hors des control-planes (voir postiz.yaml).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: postiz
            - name: POSTGRES_DB
              value: postiz
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postiz
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postiz", "-d", "postiz"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Profil "a etat" : request CPU = p95, request = limite memoire =
          # 1,2 x max, pas de limite CPU.
          # Base : p95 16m / 123Mi, max 28m / 154Mi sur 52h, 2026-10-14.
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              memory: 192Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
