# Temporal orchestre les publications planifiees de Postiz (>= v2).
# Contrairement au docker-compose officiel, pas d'Elasticsearch : la visibilite
# avancee passe par Postgres (supporte depuis Temporal 1.20), ce qui economise
# un pod JVM et son volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-dynamicconfig
  namespace: postiz
data:
  development-sql.yaml: |
    limit.maxIDLength:
      - value: 255
        constraints: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: postiz
spec:
  selector:
    app: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: postiz
  annotations:
    # Redemarre le pod quand le Secret change (rotation GCPSM via ESO).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      # Sans ca, Kubernetes injecte TEMPORAL_PORT=tcp://... (service `temporal`)
      # et le script auto-setup le prend pour sa config.
      enableServiceLinks: false
      # Pod Security "restricted" : uid/gid temporal de l'image (1000).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Toute la stack postiz reste hors des control-planes (voir postiz.yaml).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: postgres
            - name: POSTGRES_USER
              value: postiz
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: postiz
                  key: POSTGRES_PASSWORD
            - name: ENABLE_ES
              value: "false"
            - name: TEMPORAL_NAMESPACE
              value: default
            # La visibilite SQL plafonne a 3 search attributes Text par namespace :
            # les Custom*Field de demo d'auto-setup en prennent 2 et le backend
            # Postiz plante a l'enregistrement des siens (502 sur /api).
            - name: SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES
              value: "true"
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: config/dynamicconfig/development-sql.yaml
            - name: BIND_ON_IP
              value: 0.0.0.0
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: 7233
            periodSeconds: 10
          # Profil "web/standard" : request = p95, limite memoire =
          # max(1,5 x request, 1,2 x max), pas de limite CPU.
          # Base : p95 25m / 192Mi, max 46m / 193Mi sur 52h, 2026-10-14.
          resources:
            requests:
              cpu: 30m
              memory: 192Mi
            limits:
              memory: 288Mi
          volumeMounts:
            - name: dynamicconfig
              mountPath: /etc/temporal/config/dynamicconfig
      volumes:
        - name: dynamicconfig
          configMap:
            name: temporal-dynamicconfig
