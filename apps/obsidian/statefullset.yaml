apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: obsidian
  namespace: obsidian
  labels:
    app: obsidian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obsidian
  template:
    metadata:
      labels:
        app: obsidian
    spec:
      containers:
        - name: app
          image: lscr.io/linuxserver/obsidian:1.13.4

          ports:
            - containerPort: 3000
              name: http
            - containerPort: 3001
              name: https
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Paris"
          volumeMounts:
            - name: obsidian-data
              mountPath: /config
            - name: dshm
              mountPath: /dev/shm
          # Profil "web/standard" : request = p95, limite memoire =
          # max(1,5 x request, 1,2 x max), pas de limite CPU.
          # Base : p95 21m / 407Mi, max 32m / 409Mi sur 52h, 2026-10-14.
          resources:
            requests:
              cpu: "25m"
              memory: "416Mi"
            limits:
              memory: "640Mi"
      volumes:
        - name: obsidian-data
          persistentVolumeClaim:
            claimName: obsidian-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
