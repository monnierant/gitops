apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-helm
  namespace: argocd
spec:
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  source:
    chart: authentik
    repoURL: https://charts.goauthentik.io
    targetRevision: 2026.5.6
    helm:
      releaseName: authentik
      values: |
        postgresql:
          enabled: true
          primary:
            # Profil "a etat" : request CPU = p95, request = limite memoire =
            # 1,2 x max, pas de limite CPU.
            # Base : p95 39m / 240Mi, max 110m / 282Mi sur 52h, 2026-10-14.
            resources:
              requests:
                cpu: 40m
                memory: 352Mi
              limits:
                memory: 352Mi
          auth:
            existingSecret: authentik-creds
        redis:
          enabled: true
        server:
          env:
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-creds
                  key: password
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-creds
                  key: secret_key
          # Profil "web/standard" : request = p95, limite memoire =
          # max(1,5 x request, 1,2 x max), pas de limite CPU.
          # Base : p95 27m / 495Mi, max 126m / 704Mi sur 52h, 2026-10-14.
          resources:
            requests:
              cpu: 30m
              memory: 496Mi
            limits:
              memory: 864Mi
          ingress:
            ingressClassName: traefik
            enabled: true
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
              traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-prod
            hosts:
              - authentik.amonnier.fr
              - authentik.promonni.com
            tls:
              - hosts:
                  - authentik.amonnier.fr
                  - authentik.promonni.com
                secretName: authentik-tls
        worker:
          env:
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-creds
                  key: password
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-creds
                  key: secret_key
          # Profil "web/standard" : request = p95, limite memoire =
          # max(1,5 x request, 1,2 x max), pas de limite CPU.
          # Base : p95 112m / 302Mi, max 124m / 340Mi sur 52h, 2026-10-14.
          resources:
            requests:
              cpu: 120m
              memory: 304Mi
            limits:
              memory: 464Mi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: authentik
